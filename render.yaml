# Blueprint Render pour la démo gratuite (voir docs/DEPLOIEMENT-DEMO.md).
# Render → New → Blueprint → sélectionner ce dépôt.
services:
  - type: web
    name: ppg-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: DEMO_SQLITE
        value: "1"
      - key: SEED_ON_BOOT
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_LOG_LEVEL
        value: info
      # Renseignés dans l'interface Render, jamais dans le dépôt
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
